<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article — Anas Hnidi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c0c0c; --cream:#f8f4ee; --paper:#f2ede4;
  --gold:#c8a444; --gdark:#8a6e28; --mid:#6a6258; --mist:#ddd8cf;
  --D:'Playfair Display',Georgia,serif;
  --B:'Manrope',system-ui,sans-serif;
  --A:'Tajawal',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--ink);
  color:var(--cream);
  font-family:var(--B);
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
body.ar{font-family:var(--A);direction:rtl}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:56px 24px 120px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:48px;padding-bottom:20px;border-bottom:1px solid rgba(200,164,68,.18)}
.back{font-family:var(--B);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(248,244,238,.55);text-decoration:none;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.back:hover{color:var(--gold);border-color:var(--gold)}
.langtoggle{display:flex;gap:2px;background:rgba(248,244,238,.06);padding:3px;border-radius:2px}
.langtoggle button{font-family:var(--B);font-size:11px;font-weight:700;letter-spacing:.08em;padding:7px 16px;background:transparent;border:0;color:rgba(248,244,238,.5);cursor:pointer;border-radius:1px;transition:background .2s,color .2s}
.langtoggle button.active{background:var(--gold);color:var(--ink)}
.eyebrow{font-family:var(--B);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
h1.title{font-family:var(--D);font-size:clamp(28px,5vw,44px);font-weight:700;line-height:1.2;margin-bottom:20px}
.meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-family:var(--B);font-size:12px;color:rgba(248,244,238,.45);margin-bottom:36px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.excerpt{font-family:var(--B);font-size:18px;font-weight:400;color:rgba(248,244,238,.7);line-height:1.75;margin-bottom:40px;padding-bottom:36px;border-bottom:1px solid rgba(200,164,68,.14)}
.body{font-size:17px;line-height:1.9;color:rgba(248,244,238,.85)}
.body p{margin-bottom:22px}
.body h1,.body h2,.body h3{font-family:var(--D);color:var(--cream);margin:40px 0 16px;line-height:1.3}
.body h2{font-size:26px}
.body h3{font-size:20px}
.body strong{color:var(--cream);font-weight:700}
.body ul,.body ol{margin:0 0 22px;padding-inline-start:22px}
.body li{margin-bottom:8px}
.body a{color:var(--gold);border-bottom:1px solid rgba(200,164,68,.4);text-decoration:none}
.body hr{border:0;border-top:1px solid rgba(200,164,68,.18);margin:40px 0}
.externals{display:flex;gap:12px;flex-wrap:wrap;margin-top:48px;padding-top:32px;border-top:1px solid rgba(200,164,68,.18)}
.btn{font-family:var(--B);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:12px 24px;text-decoration:none;display:inline-block;transition:opacity .2s}
.btn-g{background:var(--gold);color:var(--ink)}
.btn-w{border:1px solid rgba(200,164,68,.4);color:var(--gold)}
.btn:hover{opacity:.85}
.state{font-family:var(--B);font-size:14px;color:rgba(248,244,238,.5);padding:80px 0;text-align:center}
.tag-pill{font-family:var(--B);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(200,164,68,.35);padding:4px 10px;border-radius:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html#blog" class="back" id="back-link">← Back to Insights</a>
    <div class="langtoggle">
      <button id="btn-en" class="active">EN</button>
      <button id="btn-ar">عربي</button>
    </div>
  </div>
  <div id="content"><div class="state">Loading…</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var slug = params.get('slug');
  var contentEl = document.getElementById('content');
  var lang = 'en';

  var LABELS = {
    en: { back: '← Back to Insights', notfound: 'Article not found.', loaderr: 'Could not load this article.' },
    ar: { back: '→ رجوع للمقالات', notfound: 'المقال غير موجود.', loaderr: 'تعذّر تحميل هذا المقال.' }
  };

  function setState(msg){
    contentEl.innerHTML = '<div class="state">' + msg + '</div>';
  }

  if(!slug){
    setState(LABELS.en.notfound);
  } else {
    fetch('content/articles/' + slug + '.md')
      .then(function(r){ if(!r.ok) throw new Error('not found'); return r.text(); })
      .then(function(raw){
        var m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---/);
        if(!m) throw new Error('bad frontmatter');
        var data = jsyaml.load(m[1]);
        render(data);
      })
      .catch(function(){
        setState(LABELS.en.loaderr);
      });
  }

  function fmtDate(d, l){
    if(!d) return '';
    var dt = new Date(d);
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString(l === 'ar' ? 'ar-SA' : 'en-GB', {year:'numeric', month:'long', day:'numeric'});
  }

  function render(data){
    function paint(){
      var isAr = lang === 'ar';
      document.body.classList.toggle('ar', isAr);
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';
      document.getElementById('back-link').textContent = LABELS[lang].back;
      document.getElementById('btn-en').classList.toggle('active', !isAr);
      document.getElementById('btn-ar').classList.toggle('active', isAr);

      var title = isAr ? data.title_ar : data.title_en;
      var excerpt = isAr ? data.excerpt_ar : data.excerpt_en;
      var body = isAr ? data.body_ar : data.body_en;
      document.title = title + ' — Anas Hnidi';

      var html = '';
      html += '<div class="eyebrow">' + (data.tag || '') + '</div>';
      html += '<h1 class="title">' + escapeHtml(title) + '</h1>';
      html += '<div class="meta"><span class="tag-pill">' + escapeHtml(data.tag||'') + '</span><span>' + fmtDate(data.date, lang) + '</span></div>';
      if(excerpt) html += '<div class="excerpt">' + escapeHtml(excerpt) + '</div>';
      html += '<div class="body">' + marked.parse(body || '') + '</div>';

      var links = [];
      if(data.external_linkedin) links.push('<a class="btn btn-g" target="_blank" href="' + data.external_linkedin + '">' + (isAr ? 'اقرأ على لينكدإن' : 'Read on LinkedIn') + ' →</a>');
      if(data.external_substack) links.push('<a class="btn btn-w" target="_blank" href="' + data.external_substack + '">' + (isAr ? 'اقرأ على Substack' : 'Read on Substack') + ' →</a>');
      if(links.length) html += '<div class="externals">' + links.join('') + '</div>';

      contentEl.innerHTML = html;
    }
    paint();
    document.getElementById('btn-en').onclick = function(){ lang='en'; paint(); };
    document.getElementById('btn-ar').onclick = function(){ lang='ar'; paint(); };
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }
})();
</script>
</body>
</html>
